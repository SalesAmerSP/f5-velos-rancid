version: 2
updates:
  # GitHub Actions used by workflows in this repo. Always enabled.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
    labels:
      - dependencies
      - github-actions

  # ----------------------------------------------------------------------
  # Per-language ecosystems. Uncomment the blocks for languages your
  # project actually uses, and set `directory` to the path that contains
  # the manifest file (e.g. `/` for repo-root manifests, `/python` for a
  # subdirectory).
